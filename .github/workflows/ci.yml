name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in progress; runs on main
# always finish, so every commit there keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported line (engines: >=22.23.4) and the active LTS.
        node-version: ['22.x', '24.x']
    uses: ./.github/workflows/checks.yml
    with:
      node-version: ${{ matrix.node-version }}
