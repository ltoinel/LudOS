name: Release

# Publishes a GitHub release when a version tag is pushed:
#   npm version minor && git push --follow-tags
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance (OIDC)
      attestations: write # store the provenance attestation
      artifact-metadata: write # link the attestation to the archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: page dates (sitemap, JSON-LD) come from `git log`.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x' # engines: >=22.23.4 (native TS)
          cache: npm

      # The site shows package.json's version (boot banner, `uname`, os-release),
      # so a tag that disagrees with it would ship a mislabelled release.
      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      # Built from src/site.config.example.ts (the real config is gitignored),
      # so the archive is a generic, deployable LudOS build.
      - name: Build
        run: npm run build

      - name: Package
        run: |
          name="ludos-$GITHUB_REF_NAME"
          tar -czf "$name.tar.gz" -C dist .
          (cd dist && zip -qr "../$name.zip" .)
          sha256sum "$name.tar.gz" "$name.zip" > "$name.sha256"

      # Signed provenance: `gh attestation verify <archive> -R <owner>/<repo>`
      # proves an archive was built by this workflow from this tag.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ludos-${{ github.ref_name }}.tar.gz
            ludos-${{ github.ref_name }}.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="ludos-$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" \
            --title "LudOS $GITHUB_REF_NAME" \
            --generate-notes \
            "$name.tar.gz" "$name.zip" "$name.sha256"
